[workspace]
resolver = "2"
members = ["crates/reaper-core", "crates/reaper-backends", "crates/reaper-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/OlusenBg/Reaper"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
